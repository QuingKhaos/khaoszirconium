[mod-setting-description]
khaoszirconium-byproduct=有効かつ Titanium MOD を使用する場合、ジルコニア生産時に副産物としてチタンも生産されます。
khaoszirconium-more=セラミックと金属から作られる先進的な中間生産物であるサーメットを有効にします。
khaoszirconium-early=[color=green]有効[/color]にした場合, ゲーム序盤で小量のジルコンが必要となります。\n[color=orange]無効[/color]にした場合、必要となるのは物流サイエンスパック以降になります。
khaoszirconium-ammo=有効にした場合、新たに炸裂弾倉が追加されます。
